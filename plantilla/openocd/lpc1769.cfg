# =============================================================================
# openocd/lpc1769.cfg - Configuracion de OpenOCD para la placa del curso
# =============================================================================
#
# OpenOCD siempre necesita saber dos cosas, y son independientes entre si:
#
#   1. QUE SONDA tenes enchufada       -> archivo de "interface"
#   2. QUE CHIP hay del otro lado      -> archivo de "target"
#
# Esa separacion es la razon por la que OpenOCD sirve para casi cualquier
# combinacion: cambiar de sonda es cambiar una linea, el resto queda igual.
#
# Este archivo esta armado para la LPCXpresso LPC1769 (OM13085), que trae una
# sonda CMSIS-DAP a bordo. Para otras sondas, ver la seccion del final.
#
# Uso:
#   openocd -f openocd/lpc1769.cfg -c "program build/firmware.elf verify reset exit"
#   openocd -f openocd/lpc1769.cfg          (queda como servidor gdb en el 3333)
#
# El Makefile ya hace esto por vos: make flash / make gdbserver.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. La sonda: CMSIS-DAP
# -----------------------------------------------------------------------------
# En la OM13085 la sonda es un segundo microcontrolador (un LPC11U35) soldado
# en la misma placa, corriendo el firmware CMSIS-DAP de ARM. Por eso al
# enchufar el USB no aparece "una LPC1769": aparece una sonda CMSIS-DAP
# generica, que es un estandar abierto y no algo propietario de NXP.
#
# Si tenes mas de una sonda conectada, descomenta esta linea con el numero de
# serie de la que quieras (lo lista: openocd -f interface/cmsis-dap.cfg -c "init")
#   adapter serial 0123456789

source [find interface/cmsis-dap.cfg]


# -----------------------------------------------------------------------------
# 2. El transporte: SWD
# -----------------------------------------------------------------------------
# El Cortex-M3 se puede depurar por JTAG (5 pines) o por SWD (2 pines: SWDIO
# y SWCLK). La sonda de a bordo esta cableada en SWD.

transport select swd


# -----------------------------------------------------------------------------
# 3. El chip: LPC17xx
# -----------------------------------------------------------------------------
# target/lpc17xx.cfg viene con OpenOCD y se encarga de todo lo especifico del
# chip: crear el target Cortex-M3, declarar el banco de FLASH con el driver
# "lpc2000" variante lpc1700, y poner MEMMAP en modo usuario para que los
# vectores se lean de la FLASH y no de la boot ROM.
#
# Dos variables se pueden ajustar ANTES de incluirlo:
#
#   WORKAREASIZE  cuanta SRAM le presta OpenOCD al algoritmo de escritura de
#                 FLASH (lo usa de scratch). 8 KB de los 32 KB alcanzan.
#
#   CCLK          a que frecuencia, en kHz, esta corriendo el core cuando se
#                 escribe la FLASH. Importa de verdad: las rutinas IAP de la
#                 boot ROM usan este dato para sus tiempos, y si esta mal la
#                 grabacion puede salir corrupta.
#                 Dejamos 4000 porque OpenOCD hace "reset halt" antes de
#                 grabar, y despues de un reset el LPC1769 siempre corre con
#                 el oscilador RC interno de 4 MHz. El hecho de que tu
#                 firmware despues suba a 100 MHz con la PLL no cambia nada:
#                 en el momento de grabar, todavia no corrio.

set WORKAREASIZE 0x2000
set CCLK 4000

source [find target/lpc17xx.cfg]


# -----------------------------------------------------------------------------
# 4. Velocidad
# -----------------------------------------------------------------------------
# lpc17xx.cfg termina poniendo "adapter speed 10" (10 kHz), que es lentisimo.
# Lo hace por precaucion: no sabe a que velocidad esta corriendo el chip al
# conectarse. Como nosotros reseteamos antes de hacer nada, podemos subirlo y
# grabar en un par de segundos en vez de en medio minuto.
#
# Si tenes errores de comunicacion intermitentes (cables largos, protoboard),
# bajalo a 500 o 100.

adapter speed 1000


# -----------------------------------------------------------------------------
# 5. Puerto del servidor gdb
# -----------------------------------------------------------------------------
gdb_port 3333
telnet_port 4444


# =============================================================================
# OTRAS SONDAS
# =============================================================================
# Todo lo de arriba queda igual: lo unico que cambia es el archivo de interface
# de la seccion 1. Comenta el "source [find interface/cmsis-dap.cfg]" y
# descomenta el que corresponda.
#
#   LPC-Link2 o MCU-Link (con firmware CMSIS-DAP):
#       source [find interface/cmsis-dap.cfg]        (el mismo)
#
#   J-Link de SEGGER:
#       source [find interface/jlink.cfg]
#
#   ST-Link (v2 o v3), el de las placas Nucleo/Discovery:
#       source [find interface/stlink.cfg]
#       (ojo: el ST-Link es HLA y no soporta todo; anda para grabar y debug basico)
#
#   FT2232 y clones genericos:
#       source [find interface/ftdi/dp_busblaster.cfg]
#
#   LPC-Link ORIGINAL (el de las placas LPCXpresso viejas, chip LPC3154):
#       No tiene soporte en OpenOCD. No es CMSIS-DAP: habla un protocolo
#       propietario de NXP. Hay que usar LinkServer (de MCUXpresso) o
#       reflashearlo. Ver la guia del modulo 18.
#
# La lista completa de sondas soportadas esta en el directorio "interface/" de
# tu instalacion de OpenOCD. Para verlo:
#       ls /usr/share/openocd/scripts/interface/
# =============================================================================
